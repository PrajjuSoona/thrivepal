version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: thrivepal-postgres
    environment:
      POSTGRES_USER: thriveuser
      POSTGRES_PASSWORD: thrivepass
      POSTGRES_DB: thrivedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - thrive-net

  user-service:
    build:
      context: ../user-service
    container_name: user-service
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thrivedb
      SPRING_DATASOURCE_USERNAME: thriveuser
      SPRING_DATASOURCE_PASSWORD: thrivepass
    networks:
      - thrive-net

  health-data-service:
    build:
      context: ../health-data-service
    container_name: health-data-service
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thrivedb
      SPRING_DATASOURCE_USERNAME: thriveuser
      SPRING_DATASOURCE_PASSWORD: thrivepass
    networks:
      - thrive-net

volumes:
  pgdata:

networks:
  thrive-net:
